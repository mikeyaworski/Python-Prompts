[project]
name = "prompts"
version = "0.1.0"
description = "Shared CLI prompt utilities that wrap existing libraries"
requires-python = ">=3.8"
dependencies = [
  "InquirerPy==0.3.4",
  "colorama==0.4.6"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
